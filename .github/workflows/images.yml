name: Build images

on:
  push:
    branches: ["**"]
    paths:
      - "apps/**"
      - ".github/workflows/images.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Hadolint ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [web, votes]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: apps/${{ matrix.service }}/Dockerfile
          failure-threshold: warning

  build:
    name: Build ${{ matrix.service }} ${{ matrix.target.arch }}
    needs: lint
    runs-on: ${{ matrix.target.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service: [web, votes]
        target:
          - { platform: linux/amd64, arch: amd64, runner: ubuntu-24.04 }
          - { platform: linux/arm64, arch: arm64, runner: ubuntu-24.04-arm }
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: dhi.io
          username: ${{ secrets.DHI_USERNAME }}
          password: ${{ secrets.DHI_TOKEN }}

      - id: image
        name: Set image name
        env:
          OWNER: ${{ github.repository_owner }}
          SERVICE: ${{ matrix.service }}
        run: echo "name=ghcr.io/${OWNER,,}/lab404-${SERVICE}" >> "$GITHUB_OUTPUT"

      - id: build
        name: Build and push by digest
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: apps/${{ matrix.service }}
          platforms: ${{ matrix.target.platform }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          outputs: type=image,name=${{ steps.image.outputs.name }},push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p /tmp/digest
          echo "$DIGEST" > /tmp/digest/digest

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digest-${{ matrix.service }}-${{ matrix.target.arch }}
          path: /tmp/digest/digest
          if-no-files-found: error
          retention-days: 1

  trivy:
    name: Trivy ${{ matrix.service }} ${{ matrix.arch }}
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        service: [web, votes]
        arch: [amd64, arm64]
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: digest-${{ matrix.service }}-${{ matrix.arch }}
          path: /tmp/digest

      - uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.72.0
          cache: true

      - name: Scan exact platform digest
        env:
          OWNER: ${{ github.repository_owner }}
          SERVICE: ${{ matrix.service }}
          ARCH: ${{ matrix.arch }}
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          image="ghcr.io/${OWNER,,}/lab404-${SERVICE}@$(cat /tmp/digest/digest)"
          mkdir -p reports
          trivy image --platform "linux/${ARCH}" --scanners vuln --format table --output "reports/trivy-${SERVICE}-${ARCH}.txt" "$image"
          trivy image --platform "linux/${ARCH}" --scanners vuln --format cyclonedx --output "reports/sbom-${SERVICE}-${ARCH}.cdx.json" "$image"
          cat "reports/trivy-${SERVICE}-${ARCH}.txt"
          trivy image --platform "linux/${ARCH}" --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 "$image"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: evidence-trivy-${{ matrix.service }}-${{ matrix.arch }}
          path: reports/
          retention-days: 7

  dockle:
    name: Dockle ${{ matrix.service }} ${{ matrix.arch }}
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        service: [web, votes]
        arch: [amd64, arm64]
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: digest-${{ matrix.service }}-${{ matrix.arch }}
          path: /tmp/digest

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Export exact platform digest
        env:
          OWNER: ${{ github.repository_owner }}
          SERVICE: ${{ matrix.service }}
          ARCH: ${{ matrix.arch }}
        run: |
          image="ghcr.io/${OWNER,,}/lab404-${SERVICE}@$(cat /tmp/digest/digest)"
          mkdir -p work reports
          docker pull --platform "linux/${ARCH}" "$image"
          docker save --output work/image.tar "$image"

      - name: Audit image
        env:
          SERVICE: ${{ matrix.service }}
          ARCH: ${{ matrix.arch }}
        run: |
          # Kubernetes probes own health checks; the runtimes stay shell-less.
          docker run --rm -v "$PWD/work:/scan" -v "$PWD/reports:/out" goodwithtech/dockle:v0.4.15@sha256:eade932f793742de0aa8755406c7677cd7696f8675b6180926f7eeffa7abe6b9 --exit-code 1 --exit-level fatal --ignore CIS-DI-0006 --accept-key=--access-logfile --format json --output "/out/dockle-${SERVICE}-${ARCH}.json" --input /scan/image.tar

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: evidence-dockle-${{ matrix.service }}-${{ matrix.arch }}
          path: reports/
          retention-days: 7

  publish:
    name: Publish ${{ matrix.service }} index
    needs: [trivy, dockle]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service: [web, votes]
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: digest-${{ matrix.service }}-*
          path: /tmp/digests

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create multi-platform index
        env:
          OWNER: ${{ github.repository_owner }}
          SERVICE: ${{ matrix.service }}
          IS_MAIN: ${{ github.ref == 'refs/heads/main' }}
        run: |
          image="ghcr.io/${OWNER,,}/lab404-${SERVICE}"
          immutable="${image}:sha-${GITHUB_SHA::12}"

          if docker buildx imagetools inspect "$immutable" >/dev/null 2>&1; then
            echo "::error::${immutable} already exists"
            exit 1
          fi

          refs=()
          for f in /tmp/digests/*/digest; do
            refs+=("${image}@$(cat "$f")")
          done

          tags=(--tag "$immutable")
          if [ "$IS_MAIN" = "true" ]; then
            tags+=(--tag "${image}:latest")
          fi

          docker buildx imagetools create "${tags[@]}" "${refs[@]}"

          mkdir -p reports
          docker buildx imagetools inspect "$immutable" | tee "reports/index-${SERVICE}.txt"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: evidence-index-${{ matrix.service }}
          path: reports/
          retention-days: 7

  evidence:
    name: Upload evidence
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: evidence-*
          path: reports
          merge-multiple: true

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: image-evidence-${{ github.sha }}
          path: reports/
          if-no-files-found: error
          retention-days: 90
