apiVersion: policies.kyverno.io/v1
kind: ImageValidatingPolicy
metadata:
  name: verify-application-signatures
spec:
  failurePolicy: Fail
  validationActions:
    - Deny
  webhookConfiguration:
    timeoutSeconds: 15
  matchConstraints:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: lab404
    resourceRules:
      - apiGroups:
          - ""
        apiVersions:
          - v1
        operations:
          - CREATE
          - UPDATE
        resources:
          - pods
          - pods/ephemeralcontainers
  matchImageReferences:
    - glob: ghcr.io/estelle-tamalet/lab404-web*
    - glob: ghcr.io/estelle-tamalet/lab404-votes*
  validationConfigurations:
    mutateDigest: false
    required: true
    verifyDigest: true
  attestors:
    - name: githubActionsMain
      cosign:
        keyless:
          identities:
            - subject: https://github.com/estelle-tamalet/lab404/.github/workflows/images.yml@refs/heads/main
              issuer: https://token.actions.githubusercontent.com
        ctlog:
          url: https://rekor.sigstore.dev
  validations:
    - expression: >-
        images.containers.map(
          image,
          verifyImageSignatures(image, [attestors.githubActionsMain])
        ).all(result, result > 0)
      message: Application images must be signed by the trusted GitHub Actions workflow.
